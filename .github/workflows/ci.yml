name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install API package
        run: pip install -e apps/api
      - name: Run API test suite
        working-directory: apps/api
        run: python -m pytest -q
        env:
          LUOJIA_NO_DOTENV: '1'

  knowledge-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate knowledge JSON
        run: node scripts/validate-json.js

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci
      - name: Type check
        working-directory: apps/web
        run: npx tsc --noEmit
      - name: Frontend utility tests
        working-directory: apps/web
        run: node --experimental-strip-types --test lib/ui-runtime.test.ts lib/math-expression.test.ts lib/html-sanitize.test.ts lib/demo-auth.test.ts
      - name: Production build
        working-directory: apps/web
        run: npm run build
        env:
          NEXT_PUBLIC_DESMOS_API_KEY: ''
