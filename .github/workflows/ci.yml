name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install API package
        run: pip install -e apps/api
      - name: Run API test suite
        working-directory: apps/api
        run: python -m pytest -q
        env:
          LUOJIA_NO_DOTENV: '1'
      - name: Offline Agent reliability contracts
        run: python scripts/eval_agent_reliability.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-reliability
          path: results/agent-reliability.json

  knowledge-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Validate knowledge JSON
        run: node scripts/validate-json.js

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci
      - name: Type check
        working-directory: apps/web
        run: npm run typecheck
      - name: Lint
        working-directory: apps/web
        run: npm run lint
      - name: Frontend utility tests
        working-directory: apps/web
        run: node --experimental-strip-types --test lib/ui-runtime.test.ts lib/math-expression.test.ts lib/html-sanitize.test.ts lib/demo-auth.test.ts lib/message-parser.test.ts lib/course-graph-layout.test.ts lib/visual-artifact.test.ts lib/tutor-stream.test.ts lib/learning-input.test.ts lib/message-status.test.ts lib/delivery-guard.test.ts lib/agent-run.test.ts lib/numerical-lab.test.ts lib/chat-lifetime.test.ts lib/reference-upgrade.test.ts
      - name: Production build
        working-directory: apps/web
        run: npm run build
        env:
          NEXT_PUBLIC_DESMOS_API_KEY: ''
